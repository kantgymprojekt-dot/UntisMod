name: Build Untis iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned iPhone IPA
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build for physical iOS devices (unsigned)
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project UntisMobile.xcodeproj \
            -scheme UntisMobile \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/UntisDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/UntisDerivedData/Build/Products/Release-iphoneos/UntisMobile.app"
          IPA_ROOT="$RUNNER_TEMP/UntisIPARoot"
          IPA_PATH="$RUNNER_TEMP/Untis-unsigned.ipa"

          if [[ ! -d "$APP_PATH" ]]; then
            echo "Expected app bundle was not created: $APP_PATH"
            echo "Available build products:"
            find "$RUNNER_TEMP/UntisDerivedData/Build/Products" -maxdepth 3 -print || true
            exit 1
          fi

          mkdir -p "$IPA_ROOT/Payload"
          ditto "$APP_PATH" "$IPA_ROOT/Payload/UntisMobile.app"
          (cd "$IPA_ROOT" && /usr/bin/zip -qry "$IPA_PATH" Payload)

          echo "IPA created: $IPA_PATH"
          /usr/bin/unzip -l "$IPA_PATH" | head -40
          {
            echo "Build: UntisMobile"
            echo "Configuration: Release"
            echo "Signing: unsigned (must be re-signed before installation)"
            echo "Xcode: $(xcodebuild -version | tr '\n' ' ')"
            echo "Commit: $GITHUB_SHA"
          } > "$RUNNER_TEMP/Untis-build-info.txt"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Untis-unsigned-IPA
          path: |
            ${{ runner.temp }}/Untis-unsigned.ipa
            ${{ runner.temp }}/Untis-build-info.txt
          if-no-files-found: error
          retention-days: 7
